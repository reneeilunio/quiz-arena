<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz Arena</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#070a18;
  color:#fff;
  min-height:100vh;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:30px 18px;
}

.card{
  background:#11162d;
  border:1px solid #293154;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 60px #0005;
}

.hidden{
  display:none!important;
}

h1{
  font-size:46px;
  letter-spacing:2px;
  text-align:center;
  margin:10px 0 4px;
}

h2{
  margin-top:0;
}

.sub{
  text-align:center;
  color:#9da7ca;
  margin-bottom:28px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 18px;
  font-weight:700;
  cursor:pointer;
  background:#7657ff;
  color:#fff;
  width:100%;
  margin-top:10px;
  font-size:15px;
}

button:hover{
  filter:brightness(1.08);
}

button.secondary{
  background:#252c52;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #394264;
  background:#090d20;
  color:#fff;
  font-size:16px;
  margin:6px 0 10px;
}

label{
  font-size:13px;
  color:#aeb7d8;
}

.center{
  text-align:center;
}

.pin{
  font-size:58px;
  letter-spacing:8px;
  font-weight:800;
  text-align:center;
  margin:18px 0;
}

.players{
  display:grid;
  gap:8px;
  margin-top:18px;
}

.player{
  background:#1a2040;
  padding:12px 15px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.msg{
  padding:12px;
  background:#191f3c;
  border-radius:10px;
  color:#cbd3f3;
  margin:12px 0;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.small{
  font-size:13px;
  color:#aeb7d8;
}

.score{
  font-size:34px;
  font-weight:800;
  text-align:center;
}

/* HOST OPTIONS */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  text-align:left;
  background:#242c53;
  border:1px solid #394264;
}

/* PLAYER ANSWERS */

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:24px;
}

.answer{
  min-height:90px;
  margin:0;
  border-radius:14px;
  font-size:20px;
  font-weight:800;
  text-align:left;
  padding:20px;
  transition:.15s;
}

.answer:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.answer.red{
  background:#e21b3c;
}

.answer.blue{
  background:#1368ce;
}

.answer.yellow{
  background:#d89e00;
  color:#111;
}

.answer.green{
  background:#26890c;
}

.answer.correct{
  background:#17734d!important;
}

.answer.wrong{
  background:#9b3048!important;
}

.question-text{
  font-size:30px;
  line-height:1.25;
  margin:30px 0 0;
}

.question-number{
  font-size:14px;
  color:#aeb7d8;
}

@media(max-width:600px){

  .grid,
  .answer-grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:36px;
  }

  .pin{
    font-size:44px;
  }

  .question-text{
    font-size:23px;
  }

  .answer{
    min-height:70px;
    font-size:17px;
  }

}

</style>
</head>

<body>

<div class="wrap">

<!-- HOME -->

<div class="card" id="home">

  <h1>QUIZ ARENA</h1>

  <div class="sub">
    Group 2 Barometer · 10 Questions
  </div>

  <button onclick="show('hostSetup')">
    Host a Game
  </button>

  <button class="secondary" onclick="show('join')">
    Join a Game
  </button>

</div>


<!-- HOST SETUP -->

<div class="card hidden" id="hostSetup">

  <h2>Host a Game</h2>

  <label>Quiz ID</label>

  <input
    id="quizId"
    type="number"
    value="1"
    min="1"
  >

  <button onclick="createGame()">
    Create Game
  </button>

  <button
    class="secondary"
    onclick="show('home')"
  >
    Back
  </button>

  <div id="hostSetupMsg"></div>

</div>


<!-- HOST LOBBY -->

<div class="card hidden" id="hostLobby">

  <div class="top">

    <h2>Waiting Room</h2>

    <span class="small">
      Quiz ID:
      <b id="hostQuizId"></b>
    </span>

  </div>

  <div class="small">
    GAME PIN
  </div>

  <div
    class="pin"
    id="hostPin"
  ></div>

  <div class="small">
    Players
  </div>

  <div
    class="players"
    id="hostPlayers"
  ></div>

  <button onclick="startGame()">
    START GAME
  </button>

  <button
    class="secondary"
    onclick="endGame()"
  >
    End Game
  </button>

  <div id="hostMsg"></div>

</div>


<!-- HOST QUESTION -->

<div class="card hidden" id="hostQuestion">

  <div class="top">

    <h2>Live Game</h2>

    <span
      class="small"
      id="hostQCount"
    ></span>

  </div>

  <h2
    class="question-text"
    id="hostQuestionText"
  ></h2>

  <div
    id="hostOptions"
    class="grid"
  ></div>

  <div
    class="msg"
    id="hostAnswers"
  >
    Waiting for players...
  </div>

  <button onclick="nextHostQuestion()">
    NEXT QUESTION
  </button>

</div>


<!-- JOIN -->

<div class="card hidden" id="join">

  <h2>Join a Game</h2>

  <label>Game PIN</label>

  <input
    id="joinPin"
    maxlength="6"
    placeholder="482731"
  >

  <label>Nickname</label>

  <input
    id="nickname"
    maxlength="24"
    placeholder="Renee"
  >

  <button onclick="joinGame()">
    JOIN GAME
  </button>

  <button
    class="secondary"
    onclick="show('home')"
  >
    Back
  </button>

  <div id="joinMsg"></div>

</div>


<!-- PLAYER LOBBY -->

<div class="card hidden" id="playerLobby">

  <div class="center">

    <h2>
      You're in! 🎉
    </h2>

    <div
      class="pin"
      id="playerPin"
    ></div>

    <p class="small">
      Waiting for the host to start the game...
    </p>

  </div>

</div>


<!-- PLAYER QUESTION -->

<div class="card hidden" id="playerQuestion">

  <div class="top">

    <div
      class="question-number"
      id="playerQNumber"
    ></div>

    <div class="small">
      Score:
      <b id="playerScore">0</b>
    </div>

  </div>

  <h2
    class="question-text"
    id="playerQuestionText"
  ></h2>

  <div
    id="playerOptions"
    class="answer-grid"
  ></div>

  <div id="playerMsg"></div>

</div>


<!-- FINISHED -->

<div class="card hidden" id="finished">

  <div class="center">

    <h1>
      GAME COMPLETE
    </h1>

    <div
      class="score"
      id="finalScore"
    ></div>

    <p id="finalText"></p>

    <button onclick="location.reload()">
      Back to Home
    </button>

  </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ozcjuthexxpctkbknfcs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BxgDOAcICXk48EmmyvBjiQ_oTsvQ_Ax";


/* =========================================================
   GLOBAL STATE
========================================================= */

let sb;

let game = null;

let player = null;

let questions = [];

let currentIndex = 0;

let currentQuestion = null;

let answerLocked = false;

let playerWatcher = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function show(id){

  document
    .querySelectorAll(".card")
    .forEach(x =>
      x.classList.add("hidden")
    );

  $(id).classList.remove("hidden");
}


function msg(id,text){

  $(id).innerHTML =
    '<div class="msg">' +
    text +
    '</div>';

}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =========================================================
   INIT SUPABASE
========================================================= */

async function init(){

  const s =
    document.createElement("script");

  s.src =
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

  document.head.appendChild(s);

  await new Promise(
    (resolve,reject) => {

      s.onload = resolve;

      s.onerror = reject;

    }
  );

  sb =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

}


init().catch(() => {

  alert(
    "Could not load Supabase. Check your internet connection."
  );

});


/* =========================================================
   GAME PIN
========================================================= */

function randomPin(){

  return String(
    Math.floor(
      100000 +
      Math.random() * 900000
    )
  );

}


/* =========================================================
   CREATE GAME
========================================================= */

async function createGame(){

  const quiz_id =
    Number(
      $("quizId").value || 1
    );

  const game_pin =
    randomPin();


  const {
    data,
    error
  } =
    await sb
      .from("games")
      .insert({
        quiz_id,
        game_pin,
        status:"Waiting",
        current_question:0
      })
      .select()
      .single();


  if(error){

    msg(
      "hostSetupMsg",
      "Could not create game: " +
      esc(error.message)
    );

    return;

  }


  game = data;


  $("hostPin").textContent =
    game_pin;

  $("hostQuizId").textContent =
    quiz_id;


  show("hostLobby");


  subscribeToHostGame();

  loadPlayers();

}


/* =========================================================
   LOAD PLAYERS
========================================================= */

async function loadPlayers(){

  if(!game) return;


  const {
    data,
    error
  } =
    await sb
      .from("players")
      .select("*")
      .eq("game_id",game.id)
      .order("created_at");


  if(error){

    $("hostPlayers").innerHTML =
      '<div class="msg">' +
      esc(error.message) +
      "</div>";

    return;

  }


  $("hostPlayers").innerHTML =
    data?.length

      ?

      data
        .map(
          p =>
            '<div class="player">' +

            '<span>👤 ' +
            esc(p.nickname) +
            '</span>' +

            '<b>' +
            (p.score ?? 0) +
            "</b>" +

            "</div>"
        )
        .join("")

      :

      '<div class="msg">' +
      "Waiting for players..." +
      "</div>";

}


/* =========================================================
   HOST REALTIME
========================================================= */

function subscribeToHostGame(){

  sb
    .channel(
      "host-game-" + game.id
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"players",
        filter:
          "game_id=eq." + game.id
      },
      () => {

        loadPlayers();

        if(currentQuestion){

          loadAnswerCount();

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"games",
        filter:
          "id=eq." + game.id
      },
      payload => {

        game =
          payload.new;

      }
    )

    .subscribe();

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

  const {
    data,
    error
  } =
    await sb
      .from("questions")
      .select("*")
      .eq("quiz_id",game.quiz_id)
      .order("id");


  if(error){

    msg(
      "hostMsg",
      "Could not load questions: " +
      esc(error.message)
    );

    return;

  }


  questions =
    data || [];


  if(!questions.length){

    msg(
      "hostMsg",
      "No questions found for Quiz ID " +
      game.quiz_id +
      ". Add questions first."
    );

    return;

  }


  currentIndex = 0;


  /*
    IMPORTANT:
    The host controls the active question.
  */

  const {
    data:updatedGame,
    error:updateError
  } =
    await sb
      .from("games")
      .update({
        status:"Playing",
        current_question:0
      })
      .eq("id",game.id)
      .select()
      .single();


  if(updateError){

    msg(
      "hostMsg",
      "Could not start game: " +
      esc(updateError.message)
    );

    console.error(
      updateError
    );

    return;

  }


  game =
    updatedGame;


  hostShowQuestion();

}


/* =========================================================
   QUESTION TEXT
========================================================= */

function getText(q){

  return (
    q.question_text ??
    q.question ??
    q.text ??
    q.prompt ??
    "Question"
  );

}


/* =========================================================
   QUESTION OPTIONS
   YOUR DATABASE USES answer_a / answer_b / etc.
========================================================= */

function getOptions(q){

  /*
    This is intentionally using
    answer_a, answer_b, answer_c, answer_d
    because those are the columns
    in your questions table.
  */

  return [
    q.answer_a,
    q.answer_b,
    q.answer_c,
    q.answer_d
  ]
  .filter(
    x =>
      x !== undefined &&
      x !== null &&
      String(x).trim() !== ""
  );

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function getCorrect(q){

  return String(
    q.correct_answer ??
    q.correct_option ??
    q.answer ??
    q.correct ??
    ""
  ).trim();

}


/* =========================================================
   HOST SHOW QUESTION
========================================================= */

function hostShowQuestion(){

  if(
    currentIndex >=
    questions.length
  ){

    finishGame();

    return;

  }


  currentQuestion =
    questions[currentIndex];

  // Switch the host from the lobby to the live question screen.
  // This was missing, which left the host visually stuck in Waiting Room
  // even though the game status had already changed to Playing.
  show("hostQuestion");

  $("hostQCount").textContent =
    "Question " +
    (currentIndex + 1) +
    " of " +
    questions.length;


  $("hostQuestionText").textContent =
    getText(currentQuestion);


  const options =
    getOptions(currentQuestion);


  $("hostOptions").innerHTML =
    options
      .map(
        o =>
          '<button class="option" disabled>' +
          esc(o) +
          "</button>"
      )
      .join("");


  loadAnswerCount();

}


/* =========================================================
   HOST ANSWER COUNT
========================================================= */

async function loadAnswerCount(){

  if(!game || !currentQuestion)
    return;


  const {
    data
  } =
    await sb
      .from("answers")
      .select(
        "id,player_id,is_correct"
      )
      .eq(
        "game_id",
        game.id
      )
      .eq(
        "question_id",
        currentQuestion.id
      );


  const {
    count
  } =
    await sb
      .from("players")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "game_id",
        game.id
      );


  $("hostAnswers").textContent =
    "Answers: " +
    (data?.length || 0) +
    " / " +
    (count || 0);

}


/* =========================================================
   NEXT QUESTION
========================================================= */

async function nextHostQuestion(){

  currentIndex++;


  /*
    If we've gone past the final question,
    finish the game.
  */

  if(
    currentIndex >=
    questions.length
  ){

    await finishGame();

    return;

  }


  /*
    Update Supabase FIRST.
    This tells every player which
    question should now be displayed.
  */

  const {
    data,
    error
  } =
    await sb
      .from("games")
      .update({
        current_question:
          currentIndex
      })
      .eq(
        "id",
        game.id
      )
      .select()
      .single();


  if(error){

    console.error(
      "NEXT QUESTION ERROR:",
      error
    );

    msg(
      "hostAnswers",
      "Could not move to next question: " +
      esc(error.message)
    );

    /*
      Roll back local index
    */

    currentIndex--;

    return;

  }


  game = data;


  hostShowQuestion();

}


/* =========================================================
   FINISH GAME
========================================================= */

async function finishGame(){

  if(!game)
    return;


  const {
    data,
    error
  } =
    await sb
      .from("games")
      .update({
        status:"Finished"
      })
      .eq(
        "id",
        game.id
      )
      .select()
      .single();


  if(error){

    console.error(
      "FINISH GAME ERROR:",
      error
    );

    return;

  }


  game = data;


  show("finished");


  $("finalScore").textContent =
    "Game complete!";


  $("finalText").textContent =
    "Final scores are saved in the players table.";

}


/* =========================================================
   END GAME
========================================================= */

async function endGame(){

  if(game){

    await sb
      .from("games")
      .update({
        status:"Finished"
      })
      .eq(
        "id",
        game.id
      );

  }


  location.reload();

}


/* =========================================================
   JOIN GAME
========================================================= */

async function joinGame(){

  const pin =
    $("joinPin")
      .value
      .trim();

  const nickname =
    $("nickname")
      .value
      .trim();


  if(
    !pin ||
    !nickname
  ){

    msg(
      "joinMsg",
      "Enter both the game PIN and a nickname."
    );

    return;

  }


  const {
    data:g,
    error
  } =
    await sb
      .from("games")
      .select("*")
      .eq(
        "game_pin",
        pin
      )
      .maybeSingle();


  if(error || !g){

    msg(
      "joinMsg",
      "Game not found. Check the PIN."
    );

    return;

  }


  if(
    g.status !== "Waiting"
  ){

    msg(
      "joinMsg",
      "That game has already started or ended."
    );

    return;

  }


  const {
    data:p,
    error:e
  } =
    await sb
      .from("players")
      .insert({
        game_id:g.id,
        nickname,
        score:0,
        streak:0
      })
      .select()
      .single();


  if(e){

    msg(
      "joinMsg",
      "Could not join: " +
      esc(e.message)
    );

    return;

  }


  game = g;

  player = p;


  $("playerPin").textContent =
    pin;


  show("playerLobby");


  /*
    Realtime listener
  */

  subscribeToPlayerGame();


  /*
    Backup polling.
    This is deliberately here so the player
    doesn't get stuck if Supabase realtime
    misses an UPDATE event.
  */

  startPlayerGameWatcher();

}


/* =========================================================
   PLAYER REALTIME
========================================================= */

function subscribeToPlayerGame(){

  sb
    .channel(
      "player-game-" +
      game.id +
      "-" +
      player.id
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"games",
        filter:
          "id=eq." + game.id
      },
      payload => {

        console.log(
          "PLAYER REALTIME GAME UPDATE:",
          payload.new
        );

        handlePlayerGameUpdate(
          payload.new
        );

      }
    )

    .subscribe();

}


/* =========================================================
   PLAYER BACKUP WATCHER
========================================================= */

function startPlayerGameWatcher(){

  if(playerWatcher){

    clearInterval(
      playerWatcher
    );

  }


  playerWatcher =
    setInterval(
      async () => {

        if(
          !game ||
          !player
        ){

          return;

        }


        const {
          data,
          error
        } =
          await sb
            .from("games")
            .select("*")
            .eq(
              "id",
              game.id
            )
            .single();


        if(error){

          console.error(
            "PLAYER GAME CHECK ERROR:",
            error
          );

          return;

        }


        handlePlayerGameUpdate(
          data
        );

      },
      1000
    );

}


/* =========================================================
   PLAYER GAME UPDATE
========================================================= */

async function handlePlayerGameUpdate(
  newGame
){

  if(!newGame)
    return;


  const oldStatus =
    game?.status;

  const oldQuestion =
    Number(
      game?.current_question ?? 0
    );


  game =
    newGame;


  const newQuestion =
    Number(
      game.current_question ?? 0
    );


  /*
    HOST STARTED GAME
  */

  if(
    game.status === "Playing" &&
    oldStatus !== "Playing"
  ){

    console.log(
      "PLAYER: Host started game"
    );


    await loadPlayerQuestions(
      newQuestion
    );


    return;

  }


  /*
    HOST MOVED TO ANOTHER QUESTION
  */

  if(
    game.status === "Playing" &&
    oldStatus === "Playing" &&
    newQuestion !== oldQuestion
  ){

    console.log(
      "PLAYER: Host moved from question",
      oldQuestion,
      "to",
      newQuestion
    );


    currentIndex =
      newQuestion;


    showPlayerQuestion();


    return;

  }


  /*
    GAME FINISHED
  */

  if(
    game.status === "Finished"
  ){

    if(
      playerWatcher
    ){

      clearInterval(
        playerWatcher
      );

      playerWatcher = null;

    }


    show("finished");


    $("finalScore").textContent =
      player.score ?? 0;


    $("finalText").textContent =
      "Thanks for playing!";

  }

}


/* =========================================================
   LOAD PLAYER QUESTIONS
========================================================= */

async function loadPlayerQuestions(
  requestedIndex = 0
){

  console.log(
    "PLAYER: Loading questions..."
  );


  const {
    data,
    error
  } =
    await sb
      .from("questions")
      .select("*")
      .eq(
        "quiz_id",
        game.quiz_id
      )
      .order("id");


  console.log(
    "PLAYER QUESTIONS:",
    data
  );


  if(error){

    console.error(
      "PLAYER QUESTION ERROR:",
      error
    );


    msg(
      "playerLobby",
      "Could not load questions: " +
      esc(error.message)
    );


    return;

  }


  if(
    !data ||
    !data.length
  ){

    msg(
      "playerLobby",
      "No questions are available for this quiz."
    );


    return;

  }


  questions =
    data;


  currentIndex =
    Number(
      requestedIndex
    );


  showPlayerQuestion();

}


/* =========================================================
   SHOW PLAYER QUESTION
========================================================= */

function showPlayerQuestion(){

  console.log(
    "PLAYER: Showing question",
    currentIndex + 1
  );


  if(
    currentIndex >=
    questions.length
  ){

    show("finished");


    $("finalScore").textContent =
      player.score ?? 0;


    $("finalText").textContent =
      "Thanks for playing!";


    return;

  }


  currentQuestion =
    questions[currentIndex];


  answerLocked = false;


  const options =
    getOptions(
      currentQuestion
    );


  console.log(
    "PLAYER QUESTION DATA:",
    currentQuestion
  );


  console.log(
    "PLAYER OPTIONS:",
    options
  );


  $("playerQNumber").textContent =
    "Question " +
    (currentIndex + 1) +
    " of " +
    questions.length;


  $("playerQuestionText").textContent =
    getText(
      currentQuestion
    );


  $("playerScore").textContent =
    player.score ?? 0;


  const colors = [
    "red",
    "blue",
    "yellow",
    "green"
  ];


  $("playerOptions").innerHTML =
    options
      .map(
        (o,i) =>
          '<button ' +
          'class="answer ' +
          colors[i] +
          '" ' +
          'onclick="submitAnswer(' +
          i +
          ')">' +
          esc(o) +
          "</button>"
      )
      .join("");


  $("playerMsg").innerHTML =
    "";


  /*
    IMPORTANT:
    This is what switches the player
    from "You're in!" to the actual question.
  */

  show("playerQuestion");

}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

async function submitAnswer(i){

  if(answerLocked)
    return;


  answerLocked = true;


  const options =
    getOptions(
      currentQuestion
    );


  const selected =
    String(
      options[i]
    );


  const correct =
    getCorrect(
      currentQuestion
    );


  const isCorrect =
    selected === correct ||
    String(i) === correct;


  const points =
    isCorrect
      ? 10
      : 0;


  const {
    error
  } =
    await sb
      .from("answers")
      .insert({

        question_id:
          currentQuestion.id,

        selected_answer:
          selected,

        is_correct:
          isCorrect,

        game_id:
          game.id,

        player_id:
          player.id,

        response_time:
          0,

        points

      });


  if(error){

    $("playerMsg").innerHTML =
      '<div class="msg">' +
      "Could not save answer: " +
      esc(error.message) +
      "</div>";


    answerLocked = false;

    return;

  }


  /*
    Update local score
  */

  const newScore =
    (player.score || 0) +
    points;


  player.score =
    newScore;


  await sb
    .from("players")
    .update({
      score:newScore,
      streak:
        isCorrect
          ? (player.streak || 0) + 1
          : 0
    })
    .eq(
      "id",
      player.id
    );


  /*
    Disable answer buttons
  */

  document
    .querySelectorAll(
      "#playerOptions button"
    )
    .forEach(
      (button,j) => {

        button.disabled =
          true;


        if(j === i){

          button.classList.add(
            isCorrect
              ? "correct"
              : "wrong"
          );

        }

      }
    );


  $("playerScore").textContent =
    newScore;


  $("playerMsg").innerHTML =
    '<div class="msg">' +

    (
      isCorrect
        ? "✅ Correct! +10 points"
        : "❌ Not quite. +0 points"
    ) +

    "<br><br>" +

    "Waiting for the host to move to the next question..." +

    "</div>";


  /*
    IMPORTANT:
    DO NOT advance the question here.

    The HOST controls the question number.
  */

}


/* =========================================================
   END
========================================================= */

</script>

</body>
</html>
